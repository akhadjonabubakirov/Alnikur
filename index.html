const MONTHS_SHORT={ru:["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"],
                    be:["Сту","Лют","Сак","Кра","Тра","Чэр","Ліп","Жні","Вер","Кас","Ліс","Снеж"]};
let lang="ru";
const t=k=>(DICT[lang][k]!==undefined?DICT[lang][k]:k);

// ================= Data — реальный seed из Excel Alnikor (лист «Октябрь» 2026) =================
const SEED=[
 {date:"2026-10-15",type:"in", product:"Лезунец для КРС", pack:"ведро", kg:25, pc:21, price:34910.71, sum:18328122.75, state:"соответствует", receivedBy:"Нодира", transferDate:"", transferredTo:"", transferredBy:"", gotBy:"", note:""},
 {date:"2026-10-15",type:"in", product:"Концентрат для КРС", pack:"мешок", kg:25, pc:27, price:26562.50, sum:17929678.50, state:"соответствует", receivedBy:"Нодира", transferDate:"", transferredTo:"", transferredBy:"", gotBy:"", note:""},
 {date:"2026-10-15",type:"in", product:"Добавка кормовая ПРОАМИД", pack:"мешок", kg:25, pc:36, price:36428.57, sum:32785713, state:"соответствует", receivedBy:"Нодира", transferDate:"", transferredTo:"", transferredBy:"", gotBy:"", note:""},
 {date:"2026-10-15",type:"in", product:"Алнисон", pack:"мешок", kg:15, pc:3, price:0, sum:0, state:"соответствует", receivedBy:"Нодира", transferDate:"", transferredTo:"", transferredBy:"", gotBy:"", note:""}
];
const KEY="alnikor_ops_v2";
let ops=[];
try{const s=localStorage.getItem(KEY);ops=s?JSON.parse(s):JSON.parse(JSON.stringify(SEED));}catch(e){ops=JSON.parse(JSON.stringify(SEED));}
ops.forEach(function(o,i){if(o._id===undefined)o._id=i+1;});
function findOp(id){return ops.find(o=>String(o._id)===String(id));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ops));}catch(e){}}

// ================= State =================
let view="analytics", mode="month", refDate=new Date().toISOString().slice(0,10),
    prodFilter="", search="", adminIn=false, devIn=false, editingId=null, unit="pc";
const fmt=n=>Number(n||0).toLocaleString("ru-RU",{maximumFractionDigits:2});

// ================= Helpers =================
function periodBounds(m,ref){
  const d=new Date(ref);
  if(m==="day")return[new Date(d.getFullYear(),d.getMonth(),d.getDate()),new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)];
  if(m==="week"){return[new Date(d.getFullYear(),d.getMonth(),d.getDate()-6),new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)];}
  if(m==="month")return[new Date(d.getFullYear(),d.getMonth(),1),new Date(d.getFullYear(),d.getMonth()+1,1)];
  if(m==="quarter")return[new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3,1),new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3+3,1)];
  if(m==="year")return[new Date(d.getFullYear(),0,1),new Date(d.getFullYear()+1,0,1)];
  return[new Date(2000,0,1),new Date(2100,0,1)];
}
function inPeriod(list){
  if(mode==="all")return list;
  const b=periodBounds(mode,refDate),s=b[0],e=b[1];
  return list.filter(o=>{const d=new Date(o.date);return d>=s&&d<e;});
}
const PKEY="alnikor_products_v1";
const DEFAULT_PRODUCTS=["Концентрат 6-24 с мочевиной","Алнисан с дезинфицирующим и ларвицидным эффектом","Элафид","Ални Плюс",
  "Энергопак Жидкий","Антистресс","Хелакор Меди","Хелакор Цинка","Хелакор Марганца","Хелакор Железа",
  "Милка для дойных коров","Милка для высокопродуктивных коров"];
let customProducts=[];
try{const cp=localStorage.getItem(PKEY);customProducts=cp?JSON.parse(cp):DEFAULT_PRODUCTS.slice();}catch(e){customProducts=DEFAULT_PRODUCTS.slice();}
function saveProds(){try{localStorage.setItem(PKEY,JSON.stringify(customProducts));}catch(e){}}
const products=()=>Array.from(new Set(ops.map(o=>o.product).concat(customProducts))).sort();
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.style.display="block";setTimeout(()=>el.style.display="none",2200);}

// ================= Aggregations =================
function metric(o){return unit==="pc"?(+o.pc||0)*(+o.kg||0):+o.sum||0;}
function unitLbl(){return unit==="pc"?t("unitPc"):t("unitSum");}
function kpis(){
  const list=inPeriod(ops).filter(o=>!prodFilter||o.product===prodFilter);
  let kin=0,kout=0,vin=0,vout=0;
  list.forEach(o=>{if(o.type==="in"){kin+=metric(o);vin+=+o.sum||0;}else{kout+=metric(o);vout+=+o.sum||0;}});
  return{kin:kin,kout:kout,vin:vin,vout:vout,stock:kin-kout,value:vin-vout};
}
function byProduct(){
  const m={};
  inPeriod(ops).filter(o=>!prodFilter||o.product===prodFilter).forEach(o=>{
    const r=m[o.product]||(m[o.product]={product:o.product,in:0,out:0,sum:0});
    if(o.type==="in"){r.in+=metric(o);r.sum+=unit==="pc"?Math.max(0,metric(o)):metric(o);}else{r.out+=metric(o);r.sum-=metric(o);}
  });
  return Object.values(m).sort((a,b)=>(b.in+b.out)-(a.in+a.out));
}
function overTime(){
  const per=(mode==="day"||mode==="week")?"day":"month";
  const m={};
  inPeriod(ops).filter(o=>!prodFilter||o.product===prodFilter).forEach(o=>{
    const d=new Date(o.date);
    const name=per==="day"?String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")
      :MONTHS_SHORT[lang][d.getMonth()]+" "+String(d.getFullYear()).slice(2);
    const r=m[name]||(m[name]={name:name,in:0,out:0});
    if(o.type==="in")r.in+=metric(o);else r.out+=metric(o);
  });
  return Object.values(m).sort((a,b)=>a.name.localeCompare(b.name));
}
function stockRows(){
  const m={};
  ops.forEach(o=>{
    const r=m[o.product]||(m[o.product]={product:o.product,pack:o.pack,kin:0,kout:0,pcin:0,pcout:0,vin:0});
    if(o.type==="in"){r.kin+=+o.kg||0;r.pcin+=+o.pc||0;r.vin+=+o.sum||0;}
    else{r.kout+=+o.kg||0;r.pcout+=+o.pc||0;}
  });
  return Object.values(m).filter(r=>!prodFilter||r.product===prodFilter)
    .filter(r=>!search||r.product.toLowerCase().includes(search.toLowerCase()))
    .map(r=>({product:r.product,pack:r.pack,kin:r.kin,kout:r.kout,pcin:r.pcin,pcout:r.pcout,
      balance:r.kin-r.kout,avg:r.kin>0?r.vin/r.kin:0,
      value:(r.kin-r.kout)*(r.kin>0?r.vin/r.kin:0)}))
    .sort((a,b)=>a.product.localeCompare(b.product));
}

// ================= Inline SVG charts (без внешних библиотек) =================
function svgBarChart(labels,series){ // series: [{name,color,values}]
  const W=560,H=220,padL=46,padB=38,padT=12;
  const max=Math.max(1,...series.flatMap(s=>s.values));
  const n=labels.length,gw=(W-padL-10)/Math.max(1,n),bw=Math.max(4,gw/(series.length+0.6));
  let g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  for(let i=0;i<=4;i++){
    const y=padT+(H-padT-padB)*i/4, v=max*(1-i/4);
    g+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-6)+'" y2="'+y+'" stroke="#e2e8f0"/>'+
       '<text class="axis" x="'+(padL-4)+'" y="'+(y+3)+'" text-anchor="end">'+fmt(Math.round(v))+'</text>';
  }
  labels.forEach((l,i)=>{
    const x0=padL+gw*i;
    series.forEach((s,j)=>{
      const h=(H-padT-padB)*(s.values[i]/max),x=x0+j*bw;
      g+='<rect x="'+x+'" y="'+(H-padB-h)+'" width="'+(bw-1.5)+'" height="'+Math.max(h,0)+'" fill="'+s.color+'"><title>'+s.name+': '+fmt(s.values[i])+'</title></rect>';
    });
    if(labels.length<=14)g+='<text class="axis" x="'+(x0+gw/2)+'" y="'+(H-padB+13)+'" text-anchor="middle">'+l.slice(0,12)+'</text>';
  });
  g+='</svg><div class="legend">'+series.map(s=>'<span><i style="background:'+s.color+'"></i>'+s.name+'</span>').join("")+'</div>';
  return g;
}
function svgLineChart(labels,series){
  const W=560,H=200,padL=46,padB=28,padT=12;
  const max=Math.max(1,...series.flatMap(s=>s.values));
  const n=Math.max(1,labels.length-1);
  let g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  for(let i=0;i<=4;i++){
    const y=padT+(H-padT-padB)*i/4,v=max*(1-i/4);
    g+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-6)+'" y2="'+y+'" stroke="#e2e8f0"/>'+
       '<text class="axis" x="'+(padL-4)+'" y="'+(y+3)+'" text-anchor="end">'+fmt(Math.round(v))+'</text>';
  }
  series.forEach(s=>{
    const pts=s.values.map((v,i)=>[padL+(W-padL-10)*i/n,H-padB-(H-padT-padB)*(v/max)]);
    g+='<polyline fill="none" stroke="'+s.color+'" stroke-width="2.5" points="'+pts.map(p=>p.join(",")).join(" ")+'"/>';
    pts.forEach((p,i)=>g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="'+s.color+'"><title>'+s.name+" "+labels[i]+': '+fmt(s.values[i])+'</title></circle>');
  });
  labels.forEach((l,i)=>{if(labels.length<=16)g+='<text class="axis" x="'+(padL+(W-padL-10)*i/n)+'" y="'+(H-padB+14)+'" text-anchor="middle">'+l+'</text>';});
  g+='</svg><div class="legend">'+series.map(s=>'<span><i style="background:'+s.color+'"></i>'+s.name+'</span>').join("")+'</div>';
  return g;
}
function svgDoughnut(labels,values,colors,suffix){
  const total=Math.max(1,values.reduce((a,b)=>a+Math.max(0,b),0));
  const cx=95,cy=95,r=78,ir=48;
  let ang=-Math.PI/2,g='<svg viewBox="0 0 190 190" style="width:190px;height:190px">';
  values.forEach((v,i)=>{
    const frac=Math.max(0,v)/total,a2=ang+frac*2*Math.PI;
    if(frac<=0)return;
    const large=frac>0.5?1:0;
    const x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const x3=cx+ir*Math.cos(a2),y3=cy+ir*Math.sin(a2),x4=cx+ir*Math.cos(ang),y4=cy+ir*Math.sin(ang);
    g+='<path d="M'+x1+','+y1+' A'+r+','+r+' 0 '+large+' 1 '+x2+','+y2+' L'+x3+','+y3+' A'+ir+','+ir+' 0 '+large+' 0 '+x4+','+y4+' Z" fill="'+colors[i%colors.length]+'"><title>'+labels[i]+': '+fmt(Math.round(v))+' '+(suffix||"сум")+' ('+Math.round(frac*100)+'%)</title></path>';
    ang=a2;
  });
  g+='</svg>';
  const legend=labels.map((l,i)=>'<div class="legend"><span><i style="background:'+colors[i%colors.length]+'"></i>'+l+' — '+fmt(Math.round(values[i]))+' '+(suffix||"сум")+'</span></div>').join("");
  return '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">'+g+'<div style="flex:1;min-width:150px">'+legend+'</div></div>';
}

function pivotBlock(months,bp){
  if(!bp.length)return"";
  let rows="";
  bp.forEach(function(r){
    let cells="",tot=0;
    months.forEach(function(m){
      const q=ops.filter(o=>o.product===r.product&&o.date.slice(0,7)===m);
      const v=q.reduce(function(a,o){return a+(o.type==="in"?metric(o):-metric(o));},0);
      tot+=v;
      cells+="<td class='num' style='color:"+(v<0?"#dc2626":v>0?"#059669":"#94a3b8")+"'>"+(v?v:"—")+"</td>";
    });
    rows+="<tr><td>"+r.product+"</td>"+cells+"<td class='num'><b>"+tot+"</b></td></tr>";
  });
  const head="<tr><th>"+t("product")+"</th>"+months.map(function(m){return "<th>"+MONTHS_SHORT[lang][+m.slice(5)-1]+" "+m.slice(2,4)+"</th>";}).join("")+"<th>"+t("total")+"</th></tr>";
  return "<div class='card' style='margin-top:14px'><h3 class='sec'>"+t("monthlyPivot")+"</h3>"+tableWrap("<table><thead>"+head+"</thead><tbody>"+rows+"</tbody></table>")+"</div>";
}

function addOp(){
  const g=id=>document.getElementById(id).value;
  const product=g("f-product").trim(),type=g("f-type"),kg=+g("f-kg")||0,pc=+g("f-pc")||0,price=+g("f-price")||0;
  if(!product||(!kg&&!pc)){toast(t("required"));return;}
  const rec={date:g("f-date"),type:type,product:product,pack:g("f-pack"),kg:kg,pc:pc,price:price,
    sum:Math.round(kg*price*100)/100,state:g("f-state"),receivedBy:g("f-receivedBy"),
    transferDate:g("f-transferDate"),transferredTo:g("f-transferredTo"),transferredBy:g("f-transferredBy"),
    gotBy:g("f-gotBy"),note:g("f-note")};
  if(editingId!==null){
    const i=ops.findIndex(o=>String(o._id)===String(editingId));
    if(i>=0){rec._id=ops[i]._id;ops[i]=rec;}
    editingId=null;save();toast(t("saved"));view="dev";mode="all";render();return;
  }
  rec._id=ops.reduce((m,o)=>Math.max(m,o._id||0),0)+1;
  ops.push(rec);
  save();toast(t("saved"));view="operations";mode="all";render();
}
function resetData(){ops=JSON.parse(JSON.stringify(SEED));ops.forEach(function(o,i){o._id=i+1;});save();toast(t("saved"));render();}

function editOp(id){editingId=id;view="entry";render();}
function addProduct(){
  const el=document.getElementById("newProd");
  const name=el.value.trim();
  if(!name){toast(t("required"));return;}
  if(!customProducts.includes(name))customProducts.push(name);
  customProducts.sort();
  saveProds();el.value="";toast(t("prodAdded"));renderDev();
}
function delProduct(name){
  if(!confirm(t("prodDel")+" "+name))return;
  customProducts=customProducts.filter(p=>p!==name);
  saveProds();renderDev();
}
function delOp(id){
  if(!confirm(t("confirmDel")))return;
  ops=ops.filter(o=>String(o._id)!==String(id));
  save();toast(t("saved"));render();
}

// ================= Admin =================
function showAdmin(){if(devIn){view="dev";render();}else if(adminIn){view="entry";render();}else{view="login";render();}}
function tryLogin(){
  const v=document.getElementById("passInput").value;
  if(v==="123QoRyOg@"){devIn=true;adminIn=true;editingId=null;view="dev";document.getElementById("passErr").style.display="none";render();}
  else if(v==="12345678"){adminIn=true;view="entry";document.getElementById("passErr").style.display="none";render();}
  else{document.getElementById("passErr").textContent=t("wrongPass");document.getElementById("passErr").style.display="block";}
}

// ================= Export CSV (Excel) =================
function exportCSV(){
  const head=[t("date"),t("type"),t("product"),t("pack"),t("qtyKg"),t("qtyPc"),t("price"),t("sum"),t("state"),t("receivedBy"),t("transferDate"),t("transferredTo"),t("transferredBy"),t("gotBy"),t("note")];
  const rows=ops.map(o=>[o.date,o.type==="in"?t("in"):t("out"),o.product,o.pack,o.kg,o.pc,o.price,o.sum,o.state,o.receivedBy,o.transferDate,o.transferredTo,o.transferredBy,o.gotBy,o.note]);
  const esc=v=>'"'+String(v!==undefined&&v!==null?v:"").replace(/"/g,'""')+'"';
  const csv="\uFEFF"+[head].concat(rows).map(r=>r.map(esc).join(";")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="alnikor_sklad.csv";a.click();
}

// ================= Lang & render =================
function toggleLang(){lang=lang==="ru"?"be":"ru";document.getElementById("langBtn").textContent=lang==="ru"?"BE":"RU";render();}
function render(){
  renderTabs();
  document.getElementById("loginView").style.display=(view==="login"&&!adminIn&&!devIn)?"block":"none";
  document.getElementById("views").style.display=(view==="login"&&!adminIn&&!devIn)?"none":"block";
  document.getElementById("t-appTitle").textContent=t("appTitle");
  document.getElementById("t-appSub").textContent=t("appSub");
  document.getElementById("t-download").textContent=t("download");
  document.getElementById("t-admin").textContent=t("admin");
  document.getElementById("t-login").textContent=t("login");
  document.getElementById("t-enter").textContent=t("enter");
  document.getElementById("passInput").placeholder=t("password");
  if(view==="login")return;
  if(view==="analytics")renderAnalytics();
  else if(view==="stock")renderStock();
  else if(view==="operations")renderOperations();
  else if(view==="entry"&&adminIn)renderEntry();
  else if(view==="dev"&&devIn)renderDev();
  else{view="analytics";render();}
}
document.getElementById("passInput").addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin();});
render();
